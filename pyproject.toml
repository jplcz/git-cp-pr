[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-cp-pr"
dynamic = ["version"]
description = "Automated tool to cherry-pick commits and create PRs via GitHub CLI or markdown."
readme = "README.md"
authors = [{ name = "Jarosław Pelczar", email = "jarek@jpelczar.com" }]
license = { text = "The Unlicense" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: The Unlicense",
    "Operating System :: OS Independent",
]
requires-python = ">=3.6"
dependencies = []

[project.scripts]
git-cp-pr = "git_cp_pr:main"

[tool.setuptools.dynamic]
version = { attr = "git_cp_pr.__version__" }
